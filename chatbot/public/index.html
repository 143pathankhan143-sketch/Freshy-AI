<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freshy · Chat</title><link rel="stylesheet" href="style.css"><script type="module" src="chat.js"></script></head><body>
<header><div class="brand"><b class="mark">✳</b> Freshy<span>AI</span></div><button id="reset">＋ New chat</button></header>
<main><section id="welcome"><small>✳ &nbsp; FRESHY / CHAT</small><h1>What’s on<br>your <em>mind?</em></h1><p>Ask in English, Hindi, or Hinglish. Follow up in the same chat.</p><div class="ideas"><button>Explain photosynthesis simply</button><button>Ek chhoti kahani likho</button></div></section><div id="log" role="log" aria-live="polite"></div></main>
